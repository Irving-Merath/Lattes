# Atualiza os dados do OpenAlex todo mês e grava no repositório.
# Configure o segredo OPENALEX_API_KEY em Settings > Secrets and variables > Actions.
name: Atualizar dados

on:
  schedule:
    - cron: "17 4 3 * *"   # dia 3 de cada mês, 04:17 UTC
  workflow_dispatch:
    inputs:
      min_publicacoes:
        description: "Mínimo de publicações por pesquisador"
        default: "10"

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar OpenAlex (RJ)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python coleta/openalex_rj.py --min-publicacoes "${{ inputs.min_publicacoes || '10' }}"
      - name: Gravar dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/dados
          git diff --cached --quiet || git commit -m "Atualiza dados ($(date -u +%Y-%m-%d))"
          git push
